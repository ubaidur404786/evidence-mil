[project]
name = "evidence-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "evidence-contracts",
    "evidencemil",
    "evidence-agent",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10",
]

[tool.uv.sources]
evidence-contracts = { workspace = true }
evidencemil = { workspace = true }
evidence-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_api"]
