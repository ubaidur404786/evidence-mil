apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1   # SQLite state on a PVC → single writer (ADR-008)
  strategy: { type: Recreate }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: api
          image: evidence-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets, optional: true }   # EVIDENCE_LLM_KEY, never in git
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 15 }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
          volumeMounts:
            - { name: state, mountPath: /app/state }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: state
          persistentVolumeClaim: { claimName: api-state }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-state
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: http, name: http }]
