[project]
name = "evidencemil"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.3",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "evidence-contracts",
]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]

[project.scripts]
evidencemil = "evidencemil.cli:main"

[tool.uv.sources]
evidence-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidencemil"]
