# docker compose up --build   → dashboard on http://localhost:8080
# docker compose --profile llm up --build   → also starts a local Ollama for the agent
services:
  api:
    build: { context: ., dockerfile: deploy/docker/api.Dockerfile }
    environment:
      EVIDENCE_LLM: ${EVIDENCE_LLM:-template}
      EVIDENCE_LLM_URL: ${EVIDENCE_LLM_URL:-http://llm:11434/v1}
      EVIDENCE_LLM_MODEL: ${EVIDENCE_LLM_MODEL:-llama3.2}
    volumes:
      - state:/app/state          # SQLite run store, audit log, agent checkpoints
    ports: ["8000:8000"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: deploy/docker/web.Dockerfile }
    depends_on:
      api: { condition: service_healthy }
    ports: ["8080:8080"]
    restart: unless-stopped

  llm:
    image: ollama/ollama:0.4.7
    profiles: [llm]
    volumes: [ollama:/root/.ollama]

volumes:
  state:
  ollama:
