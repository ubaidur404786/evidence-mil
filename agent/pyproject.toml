[project]
name = "evidence-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["evidence-contracts", "langgraph>=0.2", "langgraph-checkpoint-sqlite>=2"]

[tool.uv.sources]
evidence-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_agent"]
